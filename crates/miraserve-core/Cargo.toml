miraserve-telemetry.workspace = true
miraserve-tls.workspace = true
quinn.workspace = true
rustls.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
miraserve-ai.workspace = true
miraserve-fastcgi.workspace = true
miraserve-http = { workspace = true, features = ["test-h2-hooks"] }
miraserve-publish.workspace = true
miraserve-sandbox = { workspace = true, features = ["test-h2-hooks"] }
miraserve-static = { workspace = true, features = ["test-h2-hooks"] }
