[package]
name = "miraserve-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
http = "1.5.0"
libfuzzer-sys = "0.4"
serde_json = "1.0.154"
miraserve-ai = { path = "../crates/miraserve-ai" }
miraserve-config = { path = "../crates/miraserve-config" }
miraserve-fastcgi = { path = "../crates/miraserve-fastcgi" }
miraserve-migrate = { path = "../crates/miraserve-migrate" }
miraserve-publish = { path = "../crates/miraserve-publish" }
miraserve-security = { path = "../crates/miraserve-security" }
miraserve-telemetry = { path = "../crates/miraserve-telemetry" }

# Keep the fuzz crate isolated from the parent MiraServe workspace Cargo.lock.
[workspace]

[[bin]]
name = "fuzz_kdl_config"
path = "fuzz_targets/fuzz_kdl_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_http_smuggling"
path = "fuzz_targets/fuzz_http_smuggling.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fastcgi_codec"
path = "fuzz_targets/fuzz_fastcgi_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_rfc9421_bot_auth"
path = "fuzz_targets/fuzz_rfc9421_bot_auth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mcp_jsonrpc"
path = "fuzz_targets/fuzz_mcp_jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_telemetry_redact"
path = "fuzz_targets/fuzz_telemetry_redact.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_migrate_parsers"
path = "fuzz_targets/fuzz_migrate_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_publish_preflight"
path = "fuzz_targets/fuzz_publish_preflight.rs"
test = false
doc = false
bench = false
